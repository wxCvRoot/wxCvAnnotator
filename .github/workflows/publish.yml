name: Publish to PyPI

# Triggered when a GitHub Release is published
# (either manually or via the GitHub Releases UI)
on:
  release:
    types: [published]

# Required for OIDC Trusted Publisher (no API token needed in secrets)
permissions:
  id-token: write
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build wheel + sdist
  # ─────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build
        # Produces:
        #   dist/wxcvannotator-x.y.z-py3-none-any.whl
        #   dist/wxcvannotator-x.y.z.tar.gz

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ─────────────────────────────────────────────
  # Job 2: Publish to PyPI via Trusted Publisher
  #
  # Setup (one-time, in PyPI project settings):
  #   Owner:      wxCvRoot
  #   Repository: wxCvAnnotator
  #   Workflow:   publish.yml
  #   Environment: pypi
  #
  # No API token or secret needed after setup.
  # ─────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wxcvannotator

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # OIDC Trusted Publisher — authenticates automatically,
        # no PYPI_API_TOKEN secret required.
